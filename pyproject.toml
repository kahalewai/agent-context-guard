[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agent-context-guard"
version = "1.0.1"
description = "Integrity verification and access control for AI agent context files"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.10"
authors = [
    { name = "Agent Context Guard contributors" },
]
keywords = [
    "ai", "agent", "security", "integrity", "verification",
    "markdown", "llm", "context-guard", "audit", "seal",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Security",
    "Topic :: Software Development :: Libraries",
    "Typing :: Typed",
]
dependencies = [
    "click>=8.0",
    "cryptography>=41.0",
    "pyyaml>=6.0",
    "rich>=13.0",
]

[project.optional-dependencies]
# Framework adapters — install only what you need
langchain = ["langchain-core>=0.1"]
crewai = ["crewai>=0.1"]
llamaindex = ["llama-index-core>=0.10"]
autogen = ["pyautogen>=0.2"]
# Install all adapters at once
all = [
    "langchain-core>=0.1",
    "crewai>=0.1",
    "llama-index-core>=0.10",
    "pyautogen>=0.2",
]
# Development dependencies
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "ruff>=0.1",
    "mypy>=1.5",
]

[project.urls]
Homepage = "https://github.com/kahalewai/agent-context-guard"
Documentation = "https://github.com/kahalewai/agent-context-guard#readme"
Repository = "https://github.com/kahalewai/agent-context-guard"
Issues = "https://github.com/kahalewai/agent-context-guard/issues"

[project.scripts]
acg = "agent_context_guard.cli.main:main"

[tool.hatch.build.targets.wheel]
packages = ["src/agent_context_guard"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.10"
strict = true
warn_return_any = true
warn_unused_configs = true
